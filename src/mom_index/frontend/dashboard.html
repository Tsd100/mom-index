<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝妈指数 · Mom Index</title>
<script src="vendor/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  border-bottom: 1px solid #334155;
  padding: 20px 32px;
  text-align: center;
}
.header h1 {
  font-size: 28px;
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.header .subtitle {
  color: #94a3b8;
  font-size: 14px;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

/* 指数卡片网格 */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 32px; }
.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.card.nasdaq::before   { background: linear-gradient(90deg, #3b82f6, #06b6d4); }
.card.gold::before     { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.card.cpo::before      { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
.card.semiconductor::before { background: linear-gradient(90deg, #10b981, #34d399); }

.card .sector-name { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
.card .index-value { font-size: 48px; font-weight: 800; margin-bottom: 4px; }
.card .index-label { font-size: 14px; color: #64748b; margin-bottom: 12px; }
.card .signal { font-size: 13px; padding: 4px 10px; border-radius: 6px; display: inline-block; }
.card .signal.red    { background: rgba(239,68,68,0.15); color: #f87171; }
.card .signal.orange { background: rgba(251,146,60,0.15); color: #fb923c; }
.card .signal.yellow { background: rgba(250,204,21,0.15); color: #facc15; }
.card .signal.green  { background: rgba(34,197,94,0.15); color: #4ade80; }
.card .signal.blue   { background: rgba(59,130,246,0.15); color: #60a5fa; }

.card .detail-row {
  display: flex; justify-content: space-between;
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid #334155;
  font-size: 12px; color: #64748b;
}
.card .detail-row span { color: #cbd5e1; }

/* 图表区域 */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 24px; }
.chart-box {
  min-width: 0;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 20px;
}
.chart-box h3 { font-size: 16px; margin-bottom: 16px; color: #e2e8f0; }
.chart-box canvas { max-width: 100%; }

/* Top 小白帖 */
.top-posts {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 20px;
  margin-top: 24px;
}
.top-posts h3 { font-size: 16px; margin-bottom: 16px; }
.post-item {
  padding: 12px;
  border-bottom: 1px solid #334155;
  font-size: 13px;
}
.post-item:last-child { border-bottom: none; }
.post-item .post-title { color: #e2e8f0; margin-bottom: 4px; }
.post-item .post-meta { color: #64748b; font-size: 11px; }
.post-item .post-reason { color: #94a3b8; font-size: 12px; margin-top: 4px; font-style: italic; }
.post-source { display: inline-block; margin-top: 8px; color: #60a5fa; font-size: 12px; text-decoration: none; }
.post-source:hover { text-decoration: underline; }
.post-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  margin-right: 8px;
}
.post-badge.pure   { background: rgba(239,68,68,0.2); color: #fca5a5; }
.post-badge.semi   { background: rgba(251,146,60,0.2); color: #fdba74; }

/* 图例 */
.legend { display: flex; gap: 16px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-dot.nasdaq   { background: #06b6d4; }
.legend-dot.gold     { background: #fbbf24; }
.legend-dot.cpo      { background: #a78bfa; }
.legend-dot.semiconductor { background: #34d399; }

.footer { text-align: center; padding: 32px; color: #475569; font-size: 12px; }

/* 加载状态 */
.loading { text-align: center; padding: 60px; color: #64748b; }

/* 模拟数据提示 */
.mock-banner {
  background: rgba(245, 158, 11, 0.10);
  border: 1px solid #b45309;
  color: #fbbf24;
  border-radius: 8px;
  padding: 10px 16px;
  margin-bottom: 20px;
  font-size: 13px;
  text-align: center;
}

/* 今日操作信号 */
.signals-panel {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}
.signal-chip {
  flex: 1 1 280px;
  background: #1e293b;
  border: 1px solid #334155;
  border-left: 4px solid #64748b;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
}
.signal-chip.danger  { border-left-color: #ef4444; }
.signal-chip.warning { border-left-color: #f97316; }
.signal-chip.watch   { border-left-color: #eab308; }
.signal-chip.normal  { border-left-color: #22c55e; }
.signal-chip.cold    { border-left-color: #3b82f6; }
.signal-chip .sc-title { font-weight: 700; margin-bottom: 4px; color: #e2e8f0; }
.signal-chip .sc-index { color: #94a3b8; font-weight: 400; }
.signal-chip .sc-extra { color: #64748b; font-size: 11px; margin-top: 2px; }

@media (max-width: 600px) {
  .charts { grid-template-columns: 1fr; }
  .card .index-value { font-size: 36px; }
}
.daily-summary { background:#172338; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:20px; overflow-wrap:anywhere; }
.daily-summary h2 { font-size:18px; margin:0 0 8px; }
.daily-summary p, .summary-note { color:#94a3b8; font-size:13px; line-height:1.8; }
.summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:12px; margin-top:14px; }
.summary-change { border:1px solid #334155; border-radius:8px; padding:14px; min-width:0; }
.summary-change strong { display:block; font-size:16px; margin-bottom:8px; }
.summary-change details { margin-top:10px; font-size:13px; line-height:1.8; }
.summary-change summary { cursor:pointer; color:#93c5fd; }
.summary-evidence { border-top:1px solid #334155; padding:8px 0; }
.summary-source { color:#93c5fd; }
</style>
</head>
<body>

<div class="header">
  <h1>👩‍👧 宝妈指数</h1>
  <div class="subtitle">观察散户讨论特征、方向表达与每日变化</div>
  <div class="subtitle" id="update-time" style="margin-top:4px"></div>
</div>

<div class="container">
  <!-- 模拟数据提示横幅（真实数据攒满后自动隐藏） -->
  <div class="mock-banner" id="mock-banner" style="display:none"></div>
  <div id="runtime-status" style="display:none;padding:12px 16px;margin-bottom:16px;border:1px solid #334155;border-radius:8px;color:#93c5fd;font-size:13px;line-height:1.8"></div>

  <section class="daily-summary" id="quality-overview" aria-live="polite"></section>
  <section class="daily-summary" id="recent-observations" aria-live="polite"></section>

  <section class="daily-summary" id="daily-summary" aria-live="polite"><h2>每日变化摘要</h2><p>等待采集快照…</p></section>

  <!-- 当前情绪观察 -->
  <div class="signals-panel" id="signals-panel"></div>

  <!-- 四个板块指数卡片 -->
  <div class="cards" id="cards"></div>

  <!-- 图例（由 JS 动态渲染） -->
  <div class="legend" id="legend"></div>

  <!-- 历史曲线（由 JS 动态渲染） -->
  <div class="charts" id="charts"></div>

  <!-- Top 小白帖 -->
  <div class="top-posts" id="top-posts">
    <h3>🔥 今日最"小白"的帖子</h3>
    <div class="loading">加载中...</div>
  </div>
</div>

<div class="footer">
  宝妈指数 · 散户情绪观察 — 实际启用来源见采集运行状态<br>
  指数衡量样本中的讨论特征；方向表达不证明实际成交。分档及预测能力尚未验证。
</div>

<script>
const SECTOR_NAMES = {
  nasdaq: '纳斯达克',
  gold: '黄金',
  telecom: '通信',
  semiconductor: '半导体',
  innovative_drug: '创新药',
  nonferrous_metals: '有色金属',
  new_energy: '新能源',
  power: '电力',
  chip: '芯片',
  robot: '机器人',
  petrochemical: '石油石化',
  aerospace: '商业航天'
};

const SECTOR_COLORS = {
  nasdaq: '#06b6d4',
  gold: '#fbbf24',
  telecom: '#a78bfa',
  semiconductor: '#34d399',
  innovative_drug: '#f472b6',
  nonferrous_metals: '#fb923c',
  new_energy: '#22d3ee',
  power: '#facc15',
  chip: '#818cf8',
  robot: '#4ade80',
  petrochemical: '#e879f9',
  aerospace: '#94a3b8'
};

function getSignalClass(idx) {
  if (idx >= 75) return 'red';
  if (idx >= 60) return 'orange';
  if (idx >= 40) return 'yellow';
  if (idx >= 20) return 'green';
  return 'blue';
}

function getEmoji(idx) {
  if (idx >= 75) return '🔴';
  if (idx >= 60) return '🟠';
  if (idx >= 40) return '🟡';
  if (idx >= 20) return '🟢';
  return '🔵';
}

function observationLabel(idx) {
  if (idx >= 75) return '讨论特征评分极高';
  if (idx >= 60) return '讨论特征评分较高';
  if (idx >= 40) return '讨论特征评分中等';
  if (idx >= 20) return '讨论特征评分较低';
  return '讨论特征评分很低';
}
function renderLegend(data) {
  const container = document.getElementById('legend');
  const sectors = data && data.sector_history ? Object.keys(data.sector_history) : [];
  container.innerHTML = sectors.map(key =>
    '<div class="legend-item"><div class="legend-dot" style="background:' + (SECTOR_COLORS[key] || '#94a3b8') + '"></div>' + (SECTOR_NAMES[key] || key) + '</div>'
  ).join('');
  const realCount = data.real_record_count ?? data.record_count;
  if ((data.record_count || 0) > realCount) {
    container.innerHTML += '<div class="legend-item" style="color:#fbbf24">┅┅ 虚线 = 模拟历史</div>';
  }
}

function renderDataNotice(data) {
  const banner = document.getElementById('mock-banner');
  const counts = data.excluded_records || {};
  const latest = data.latest;
  const provenance = latest?.provenance;
  const finishedAt = Date.parse(provenance?.finished_at);
  const expired = provenance && (!Number.isFinite(finishedAt) || Date.now() < finishedAt || Date.now() - finishedAt > 24 * 3600000);
  banner.style.display = 'block';
  banner.textContent = `生产模式 · 已核验记录 ${data.real_record_count || 0} 天；` +
    `隔离未核验旧记录 ${counts.unverified || 0} 条、模拟记录 ${counts.mock || 0} 条。` +
    (expired ? ' ⚠️ 采集结果已超过 24 小时，暂停情绪判断。' : '') +
    (provenance ? ` 上次采集：${provenance.finished_at}；口径 ${provenance.definition.id.slice(0, 12)}。` : ' 等待采集任务发布首份有效快照。') +
    ' 页面每 5 分钟重新读取数据，不会触发采集。列表更新时间不代表发布时间。';
  if (provenance) {
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = '查看采集运行状态、来源与口径';
    const body = document.createElement('div');
    body.style.cssText = 'text-align:left;overflow-wrap:anywhere;font-weight:normal';
    const startedAt = Date.parse(provenance.started_at);
    const duration = Number.isFinite(startedAt) && Number.isFinite(finishedAt)
      ? `${Math.max(0, Math.round((finishedAt - startedAt) / 1000))} 秒` : '未知';
    const sourceNames = {guba:'东方财富',xhs:'小红书',xueqiu:'雪球'};
    const stateNames = {ok:'完成',disabled:'未启用',empty:'无结果',failed:'失败',partial:'部分完成',demo_only:'仅演示，已排除'};
    const sourceLines = Object.entries(provenance.sources || {}).map(([name, report]) => {
      const sectors = Object.entries(report.sectors || {}).map(([key, state]) =>
        `${SECTOR_NAMES[key] || key}：${stateNames[state.status] || state.status}，解析 ${state.parsed_count ?? 0} 条，完成 ${state.fetched_pages ?? 0}/${state.requested_pages ?? 0} 页${state.error_type ? `，错误 ${state.error_type}` : ''}`
      );
      return `${sourceNames[name] || name}：${stateNames[report.status] || report.status}${sectors.length ? `（${sectors.join('；')}）` : ''}`;
    });
    const definition = provenance.definition || {};
    body.textContent = `运行编号：${provenance.run_id}；开始：${provenance.started_at || '未知'}；结束：${provenance.finished_at || '未知'}；耗时：${duration}；` +
      `采样口径：${definition.id || '未知'}；代码审计指纹：${definition.audit_id || '历史记录未保存'}；页数：${definition.pages ?? '未知'}；` +
      sourceLines.join('；');
    details.append(summary, body); banner.append(details);
  }

}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function productionView(input) {
  // 拒绝部署前遗留的静态 JSON，避免后端未运行时展示旧模拟数据。
  if (input.schema_version !== 2 || input.mode !== 'production') {
    return {schema_version: 2, mode: 'production', latest: null, signals: [],
            sector_history: {}, price_history: {}, real_record_count: 0,
            excluded_records: {unverified: input.record_count || 0, mock: 0}};
  }
  const data = JSON.parse(JSON.stringify(input));
  const p = data.latest?.provenance;
  if (!p || !p.mock_excluded || !p.run_id || !p.definition?.id) {
    data.latest = null; data.signals = []; data.sector_history = {};
    data.daily_summary = null;
    return data;
  }
  const age = Date.now() - Date.parse(p.finished_at);
  const expired = !Number.isFinite(age) || age < 0 || age > 24 * 3600000;
  Object.values(data.latest.sectors || {}).forEach(sector => {
    if (expired || sector.quality?.status !== 'ok') {
      sector.index = null;
      sector.interpretation = expired ? '采集结果已过期，暂停情绪判断' : '数据不足，暂停情绪判断';
    } else {
      sector.interpretation = observationLabel(sector.index) + ' · 分档尚未校准';
    }
  });
  data.signals = (data.signals || []).map(signal => {
    if (data.latest.sectors[signal.sector]?.index == null) {
      return {...signal, index: null, delta: null, level: 'unavailable',
              action: '数据不足或采集结果过期，暂停情绪判断', extras: ''};
    }
    return {...signal, action: observationLabel(signal.index),
      extras: signal.observation_version === 1 ? signal.extras : '',
      delta: signal.comparison_date ? signal.delta : null};
  });
  if (expired) {
    data.daily_summary = {status:'expired',highlights:[],unavailable:[],not_comparable:[],available_count:0,
      total_count:Object.keys(data.latest.sectors || {}).length};
  } else if (data.daily_summary) {
    data.daily_summary.highlights = (data.daily_summary.highlights || []).filter(item =>
      data.latest.sectors[item.sector]?.index != null);
  }
  return data;
}

function snapshotExpired(data) {
  const age = Date.now() - Date.parse(data.latest?.provenance?.finished_at);
  return !Number.isFinite(age) || age < 0 || age > 24 * 3600000;
}

function renderQualityOverview(data) {
  const panel = document.getElementById('quality-overview');
  panel.innerHTML = '<h2>采集与样本质量</h2>';
  if (!data.latest) { panel.innerHTML += '<p>等待首份已核验采集快照。</p>'; return; }
  const overview = data.quality_overview || {};
  const rows = overview.sectors || Object.fromEntries(Object.entries(data.latest.sectors || {}).map(([key,value]) =>
    [key,{...value.quality,recent_count:value.quality?.valid_fresh_count}]));
  const expired = snapshotExpired(data);
  const names = {ok:'合格',stale:'近期样本占比不足',collection_failed:'来源不完整',insufficient:'有效样本不足',unknown_time:'样本时间待核验',unknown:'未记录',failed:'失败',partial:'部分完成',empty:'无结果'};
  const sourceNames = {ok:'抓取完成',failed:'失败',partial:'部分失败',empty:'无结果',unknown:'未记录'};
  const platformNames = {guba:'东方财富',xhs:'小红书',xueqiu:'雪球'};
  const count = expired ? 0 : Object.values(rows).filter(row => row.status === 'ok').length;
  panel.innerHTML += `<p>${expired ? '上次采集结果已过期，当前暂停判断。' : `当前样本合格 ${count}/${Object.keys(rows).length} 个板块。`} 抓取成功与样本合格分别记录。连续失败按有记录的每日最终快照统计，不包含同日重试次数。</p>`;
  panel.innerHTML += `<details class="summary-note"><summary>查看板块质量与最近成功时间</summary><div class="summary-grid">${Object.entries(rows).map(([key,row]) =>
    `<article class="summary-change"><strong>${escapeHtml(SECTOR_NAMES[key] || key)}</strong><div>样本：${escapeHtml(names[row.status] || row.status || '未记录')} · 来源：${escapeHtml(sourceNames[row.failed_sources?.length && row.collection_status === 'ok' ? 'partial' : row.collection_status] || row.collection_status || '未记录')}</div><div>采集时近期有效 ${escapeHtml(row.recent_count ?? '未记录')}/${escapeHtml(row.valid_count ?? '未记录')}</div><div>最近抓取成功：${escapeHtml(row.last_collection_success_at || '未记录')}</div><div>最近样本合格：${escapeHtml(row.last_qualified_at || '未记录')}</div><div>连续失败观测日：${escapeHtml(row.consecutive_failed_observations ?? '未记录')}</div><div>${escapeHtml((row.reasons || []).join('；'))}</div>${row.failed_sources?.length ? `<div>失败来源：${escapeHtml(row.failed_sources.map(source => platformNames[source] || source).join('、'))}</div>` : ''}</article>`
  ).join('')}</div></details>`;
}

function renderRecentObservations(data) {
  const panel = document.getElementById('recent-observations');
  panel.innerHTML = '<h2>近期样本观察</h2><p>统计采集时 24 小时内更新的有效帖子，不等于新发布或新增投资者；独立展示，不替代正式指数。</p>';
  if (!data.latest) { panel.innerHTML += '<p>等待首份近期样本观察。</p>'; return; }
  const expired = snapshotExpired(data);
  panel.innerHTML += `<details class="summary-note"><summary>查看各板块近期样本</summary><div class="summary-grid">${Object.entries(data.latest.sectors || {}).map(([key,sector]) => {
    const item = sector.recent_observation;
    if (!item) return `<article class="summary-change"><strong>${escapeHtml(SECTOR_NAMES[key] || key)}</strong>旧快照未记录此观察项，等待后续采集。</article>`;
    const canObserve = !expired && item.status === 'ok' && item.directions;
    const direction = item.directions || {};
    const message = expired ? '采集结果已过期，暂停方向与情绪观察。' : item.status === 'source_unavailable'
      ? '来源不完整或未核验，暂停方向与情绪观察。' : '近期有效样本不足 30 条，暂停方向与情绪观察。';
    return `<article class="summary-change"><strong>${escapeHtml(SECTOR_NAMES[key] || key)}</strong><div>采集时近期有效 ${escapeHtml(item.recent_count)}/${escapeHtml(item.valid_count)}</div><div>时间未确认 ${escapeHtml(item.unknown_time_count ?? '未记录')}</div>${canObserve
      ? `<div>买入表达 ${escapeHtml(direction.buy)} · 卖出表达 ${escapeHtml(direction.sell)} · 方向未确认 ${escapeHtml(direction.neutral)}</div><div>规则情绪均值（−1～1）：${escapeHtml(item.mean_sentiment)}</div>`
      : `<div>${message}</div>`}</article>`;
  }).join('')}</div></details>`;
}

function renderComponentChange(change) {
  if (!change || change.status !== 'ok') return '<div class="summary-note component-change">旧记录缺少完整分量，暂不能拆解公式变化。</div>';
  const signed = value => typeof value === 'number' && Number.isFinite(value) ? `${value > 0 ? '+' : ''}${value.toFixed(4)}` : '—';
  return `<details class="component-change"><summary>查看四项公式贡献</summary><p class="summary-note">加权分量之差，用于核对总分变化，不解释市场因果。</p>${(change.items || []).map(item => `<div>${escapeHtml(item.label)}：${escapeHtml(signed(item.change))} 分</div>`).join('')}<div class="summary-note">总分舍入差：${escapeHtml(signed(change.rounding_residual))} 分</div></details>`;
}

function renderDailySummary(data) {
  const panel = document.getElementById('daily-summary');
  const summary = data.daily_summary;
  panel.innerHTML = '<h2>每日变化摘要</h2>';
  if (!data.latest || !summary || summary.status === 'waiting') {
    panel.innerHTML += '<p>等待采集任务生成每日摘要；首次记录或规则升级后，需积累同口径记录才能比较。</p>';
    return;
  }
  if (summary.status === 'expired') {
    panel.innerHTML += '<p>采集结果已过期或时间未核验，暂停变化摘要。等待下一次有效采集。</p>';
    return;
  }
  panel.innerHTML += `<p>${escapeHtml(summary.date)} 采集快照 · 可观察板块 ${escapeHtml(summary.available_count)}/${escapeHtml(summary.total_count)}。按指数变化幅度显示最多三个板块；比较日期可能并非昨日。</p>`;
  const changes = summary.highlights || [];
  panel.innerHTML += changes.length ? `<div class="summary-grid">${changes.map(item => {
    const delta = Number(item.delta);
    const deltaText = Number.isFinite(delta) ? `${delta > 0 ? '+' : ''}${delta.toFixed(1)}` : '—';
    const evidence = (item.evidence || []).map(post => {
      const url = safePostUrl(post.source_url);
      return `<div class="summary-evidence">${escapeHtml(post.title)}<div class="summary-note">${escapeHtml(post.reasoning)} ${escapeHtml(post.intent_basis)}</div>${url ? `<a class="summary-source" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">查看原帖 ↗</a>` : '<span class="summary-note">原帖链接未提供或未通过核验</span>'}</div>`;
    }).join('');
    return `<article class="summary-change"><strong>${escapeHtml(SECTOR_NAMES[item.sector] || item.sector)} ${escapeHtml(deltaText)} 分</strong><div class="summary-note">较 ${escapeHtml(item.comparison_date)} · 当前 ${escapeHtml(item.index)} 分<br>有效样本 ${escapeHtml(item.valid_count)}/${escapeHtml(item.sample_count)}</div>${renderComponentChange(item.component_change)}<details><summary>查看代表帖子与判定依据</summary><p class="summary-note">代表帖子用于核对规则，不证明其导致了指数变化。</p>${evidence || '<p class="summary-note">本次快照未保留代表帖子。</p>'}</details></article>`;
  }).join('')}</div>` : '<p>暂无可比较的板块变化。首份记录、口径切换或上期质量缺口均会暂停比较。</p>';
  const notes = [...(summary.unavailable || []), ...(summary.not_comparable || [])];
  if (notes.length) {
    panel.innerHTML += `<details class="summary-note"><summary>查看未参与比较的板块（${notes.length}）</summary>${notes.map(item => `<div>${escapeHtml(SECTOR_NAMES[item.sector] || item.sector)}：${escapeHtml(item.reason)}</div>`).join('')}</details>`;
  }
}

function renderCards(data) {
  const container = document.getElementById('cards');
  const latest = data.latest;
  if (!latest) {
    document.getElementById('update-time').textContent = '暂无已核验采集记录';
    container.innerHTML = '<div class="loading">暂无已核验采集记录，请等待采集任务完成，或查看采集运行状态。</div>';
    return;
  }

  document.getElementById('update-time').textContent = 
    `更新于 ${latest.date}`;

  const signalsMap = {};
  (data.signals || []).forEach(s => { signalsMap[s.sector] = s; });

  container.innerHTML = Object.entries(latest.sectors)
  .sort((a, b) => b[1].index - a[1].index)
  .map(([key, sector]) => {
    const cls = sector.index == null ? "" : getSignalClass(sector.index);
    const d = sector.details || {};
    const color = SECTOR_COLORS[key] || '#64748b';
    const sig = signalsMap[key] || {};
    const instrument = sector.instrument || {};
    const current = (data.instruments || {})[key] || {};
    const instrumentHtml = `<div style="font-size:12px;line-height:1.6;color:#94a3b8;overflow-wrap:anywhere">
      最近采集标的：${escapeHtml(instrument.fund_name || instrument.etf || '标的映射待核验')}<br>
      当前映射：${escapeHtml(current.fund_name || current.etf || '未提供')} ${escapeHtml(current.etf || '')}<br>
      ${escapeHtml(current.coverage_note || '')}
      ${sector.mapping_warning ? `<br><span style="color:#fbbf24">${escapeHtml(sector.mapping_warning)}</span>` : ''}
      ${current.source_url && /^https:\/\//.test(current.source_url) ? `<br><a href="${escapeHtml(current.source_url)}" target="_blank" rel="noopener noreferrer">官方标的资料</a>` : ''}
    </div>`;
    const deltaHtml = sig.delta != null
      ? `<div class="index-label" style="color:${sig.delta >= 0 ? '#f87171' : '#4ade80'}">较 ${escapeHtml(sig.comparison_date)} ${sig.delta >= 0 ? '+' : ''}${sig.delta.toFixed(1)}</div>`
      : '<div class="index-label">宝妈指数</div>';
    return `
      <div class="card">
        <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,${color},${color}88);"></div>
        <div class="sector-name">${sector.index == null ? "⚪" : getEmoji(sector.index)} ${SECTOR_NAMES[key]}</div>
        <div class="index-value">${sector.index ?? "—"}</div>
        ${deltaHtml}
        ${instrumentHtml}
        <div class="signal ${cls}">${escapeHtml(sector.interpretation)}</div>
        <div style="font-size:12px;line-height:1.8;color:#94a3b8;margin-top:10px">
          样本 ${sector.quality?.sample_count ?? 0} · 有效 ${sector.quality?.valid_count ?? 0}<br>
          有效帖 24h 内更新 ${sector.quality?.valid_fresh_count ?? sector.quality?.fresh_count ?? 0} · 时间未知 ${sector.quality?.valid_unknown_time_count ?? sector.quality?.unknown_time_count ?? 0}<br>
          首次采集 ${sector.quality?.newly_seen_count ?? 0} · 已见 ${sector.quality?.previously_seen_count ?? 0}<br>
          重复 ${ (sector.quality?.duplicate_count ?? 0) + (sector.quality?.collector_duplicates ?? 0)} · 排除模拟 ${sector.quality?.mock_excluded ?? 0}<br>
          ${escapeHtml((sector.quality?.reasons || []).join('；'))}
        </div>
        <!-- 买入/卖出子指数 -->
        <div style="margin-top:14px; display:flex; gap:8px;">
          <div style="flex:1; background:rgba(34,197,94,0.08); border-radius:8px; padding:8px; text-align:center;">
            <div style="font-size:20px; font-weight:700; color:#4ade80;">${sector.index == null ? "—" : (d.mom_buy_index ?? 0)}</div>
            <div style="font-size:10px; color:#64748b;">🟢 买入表达评分</div>
          </div>
          <div style="flex:1; background:rgba(239,68,68,0.08); border-radius:8px; padding:8px; text-align:center;">
            <div style="font-size:20px; font-weight:700; color:#f87171;">${sector.index == null ? "—" : (d.mom_sell_index ?? 0)}</div>
            <div style="font-size:10px; color:#64748b;">🔴 卖出表达评分</div>
          </div>
        </div>
        <!-- 买卖比进度条 -->
        <div style="margin-top:8px; display:flex; align-items:center; gap:6px; font-size:10px; color:#64748b;">
          <span>卖出表达 ${d.sell_count||0}</span>
          <div style="flex:1; height:5px; background:#2d1f1f; border-radius:3px; overflow:hidden; display:flex;">
            <div style="width:${(d.buy_count||0)/(Math.max(d.buy_count||0, d.sell_count||0, 1))*100}%; height:100%; background:linear-gradient(90deg,#22c55e,#4ade80);"></div>
          </div>
          <span>买入表达 ${d.buy_count||0}</span>
        </div>
        <div class="detail-row">
          <span>小白帖</span><span>${d.newbie_posts || 0}/${d.valid_posts || d.total_posts || 0} (${d.newbie_ratio || 0}%)</span>
        </div>
        <div class="detail-row">
          <span>表达方向</span><span style="color:${(d.buy_sell_ratio||0)>1.5?'#f87171':(d.buy_sell_ratio||0)>0.8?'#facc15':'#4ade80'}">${sector.index == null || !(d.buy_count || d.sell_count) ? "— 方向未确认" : `买 ${d.buy_count || 0} / 卖 ${d.sell_count || 0}`}</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderSignals(data) {
  const panel = document.getElementById('signals-panel');
  const list = data.signals || [];
  if (!list.length) {
    panel.innerHTML = '';
    return;
  }
  panel.innerHTML = list.map(s => `
    <div class="signal-chip ${s.level}">
      <div class="sc-title">${escapeHtml(s.name)} <span class="sc-index">${s.index ?? "—"}</span>
        ${s.delta != null ? `<span style="color:${s.delta >= 0 ? '#f87171' : '#4ade80'}">${s.delta >= 0 ? '▲' : '▼'} ${Math.abs(s.delta)}</span>` : ''}
      </div>
      <div>${escapeHtml(s.action)}</div>
      ${s.extras ? `<div class="sc-extra">${escapeHtml(s.extras)}</div>` : ''}
    </div>
  `).join('');
}

let activeCharts = [];
function renderCharts(data) {
  activeCharts.forEach(chart => chart.destroy());
  activeCharts = [];
  const chartsContainer = document.getElementById('charts');
  chartsContainer.innerHTML = '';
  const history = data.sector_history || {};
  const priceHistory = data.price_history || {};
  const realDates = new Set(data.real_dates || []);
  const priceRealDates = new Set(data.price_real_dates || Array.from(realDates));
  
  Object.entries(history).forEach(([sector, records]) => {
    if (!records.length) return;
    
    const box = document.createElement('div');
    box.className = 'chart-box';
    box.innerHTML = `<h3>📈 ${SECTOR_NAMES[sector] || sector} — 宝妈指数走势</h3><canvas id="chart-${sector}"></canvas>`;
    chartsContainer.appendChild(box);
    
    const canvas = box.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const color = SECTOR_COLORS[sector] || '#94a3b8';
    
    // 价格数据按日期对齐
    const pArr = priceHistory[sector] || [];
    const priceMap = {};
    pArr.forEach(p => { priceMap[p.date] = p.price; });
    const recordsByDate = new Map(records.map(record => [record.date, record]));
    const dates = [...new Set([...records.map(r => r.date), ...pArr.map(p => p.date)])].sort();
    const emotionRecords = dates.map(day => recordsByDate.get(day) || null);
    const emotionVals = emotionRecords.map(record => record?.index ?? null);
    const priceVals = dates.map(day => priceMap[day] ?? null);
    const hasPrice = priceVals.some(v => v !== null);
    
    activeCharts.push(new Chart(ctx, {
      type: 'line',
      data: {
        labels: dates.map(day => day.slice(5)),
        datasets: [{
          label: SECTOR_NAMES[sector],
          data: emotionVals,
          borderColor: color,
          backgroundColor: color + '20',
          borderWidth: 2,
          fill: false,
          tension: 0.3,
          spanGaps: true,
          pointRadius: 2,
          pointHoverRadius: 5,
          yAxisID: 'y',
          segment: {
            borderDash: ctx => realDates.has(dates[ctx.p0DataIndex]) ? undefined : [6, 4],
            borderColor: ctx => emotionSegmentColor(emotionRecords, ctx.p0DataIndex, ctx.p1DataIndex, color),
          },
        }].concat(hasPrice ? {
          label: SECTOR_NAMES[sector] + ' 当前映射ETF价格',
          data: priceVals,
          borderColor: '#f59e0b',
          backgroundColor: 'rgba(245,158,11,0.08)',
          borderWidth: 1.5,
          borderDash: [4, 2],
          fill: false,
          tension: 0.3,
          pointRadius: 1,
          pointHoverRadius: 4,
          yAxisID: 'y1',
          segment: {
            borderDash: ctx => priceRealDates.has(dates[ctx.p0DataIndex]) ? [4, 2] : [2, 3],
          },
        } : [])
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1e293b',
            titleColor: '#e2e8f0',
            bodyColor: '#cbd5e1',
            borderColor: '#334155',
            borderWidth: 1,
            callbacks: {
              label: ctx => {
                const set = ctx.dataset.yAxisID === 'y1' ? priceRealDates : realDates;
                const tag = set.has(dates[ctx.dataIndex]) ? '' : '（模拟）';
                return ctx.dataset.yAxisID === 'y1'
                  ? `价格: ${ctx.parsed.y}${tag}`
                  : `宝妈指数: ${ctx.parsed.y}${tag}`;
              }
            }
          }
        },
        scales: {
          y: {
            min: 0, max: 100, position: 'left',
            grid: { color: '#33415533' },
            ticks: { color: '#64748b' },
            title: { display: true, text: '宝妈指数', color: '#64748b' },
          },
          ...(hasPrice ? {
            y1: {
              position: 'right',
              grid: { drawOnChartArea: false },
              ticks: { color: '#f59e0b' },
              title: { display: true, text: '价格', color: '#f59e0b' },
            }
          } : {}),
          x: {
            grid: { color: '#33415533' },
            ticks: { color: '#64748b', maxTicksLimit: 10 },
          }
        },
        // 危险区间背景
        // 通过 annotation 插件可以实现，这里保持简洁
      }
    }));
  });
}

function emotionSegmentColor(emotionRecords, startIndex, endIndex, color) {
  const observations = emotionRecords.slice(startIndex, endIndex + 1).filter(Boolean);
  if (observations.length < 2 || observations.some(row => row.index == null)) return 'transparent';
  const definition = observations[0].definition_id;
  return observations.every(row => row.definition_id === definition) ? color : 'transparent';
}

const POST_SOURCE_HOSTS = ['guba.eastmoney.com', 'xueqiu.com', 'xiaohongshu.com', 'xhslink.com'];
function safePostUrl(value) {
  try {
    const url = new URL(value);
    const host = url.hostname.toLowerCase();
    return url.protocol === 'https:' && POST_SOURCE_HOSTS.some(allowed => host === allowed || host.endsWith(`.${allowed}`))
      ? url.href : '';
  } catch { return ''; }
}

function renderTopPosts(data) {
  const container = document.getElementById('top-posts');
  container.innerHTML = '<h3>典型帖子（采集快照）</h3>';
  const latest = data.latest;
  if (!latest) {
    container.innerHTML += '<div class="loading">暂无数据</div>';
    return;
  }

  // 从所有板块收集 top 小白帖
  let allTop = [];
  Object.entries(latest.sectors).forEach(([sector, sdata]) => {
    (sdata.top_newbie_posts || []).forEach(p => {
      allTop.push({ ...p, sector: SECTOR_NAMES[sector] });
    });
  });

  // 按分数排序
  allTop.sort((a, b) => b.score - a.score);
  allTop = allTop.slice(0, 8);

  if (!allTop.length) {
    container.innerHTML += '<div class="loading">今日暂无典型小白帖</div>';
    return;
  }

  const badgeClass = score => score >= 50 ? 'pure' : 'semi';
  const badgeText = score => score >= 50 ? '纯小白' : '偏小白';

  container.innerHTML += allTop.map(p => `
  <div class="post-item">
    <div class="post-title">
      <span class="post-badge ${badgeClass(p.score)}">${badgeText(p.score)} ${p.score}分</span>
      <span style="color:#64748b;font-size:11px">[${p.sector}]</span>
      ${p.intent_label ? `<span style="font-size:11px;margin-left:4px">${escapeHtml(p.intent_label)}</span>` : ''}
      ${escapeHtml(p.title)}
    </div>
    ${p.reasoning ? `<div class="post-reason">📝 ${escapeHtml(p.reasoning)}</div>` : ''}
    ${p.intent_basis ? `<div class="post-meta">${escapeHtml(p.intent_basis)}</div>` : ''}
    ${p.key_signals ? p.key_signals.map(s => `<div class="post-meta">▸ ${escapeHtml(s)}</div>`).join('') : ''}
    ${safePostUrl(p.source_url) ? `<a class="post-source" href="${escapeHtml(safePostUrl(p.source_url))}" target="_blank" rel="noopener noreferrer">查看原帖 ↗</a>` : ''}
  </div>
  `).join('');
}

// 加载数据（每 5 分钟自动刷新）
function renderRuntimeStatus(state) {
  const panel = document.getElementById('runtime-status');
  if (!state.collection_time) { panel.style.display = 'none'; return; }
  const names = {running:'正在采集',completed:'已完成',partial:'部分完成，请查看样本质量',failed:'运行失败，等待重试或下次任务',interrupted:'上次运行被中断'};
  const result = state.result || {};
  panel.style.display = 'block';
  panel.textContent = `NAS 自动采集：每天 ${state.collection_time}（上海时间）；${names[state.status] || '等待采集'}。` +
    (state.next_run_at ? ` 下次运行：${state.next_run_at}。` : '') +
    (state.last_finished_at ? ` 上次结束：${state.last_finished_at}。` : '') +
    (result.total_sectors != null ? ` 上次有效板块 ${result.valid_sectors ?? 0}/${result.total_sectors}。` : '');
}

function loadRuntimeStatus() {
  fetch('data/service_status.json', {cache:'no-store'})
    .then(response => {if (!response.ok) throw new Error('unavailable'); return response.json();})
    .then(renderRuntimeStatus)
    .catch(() => {
      const panel = document.getElementById('runtime-status');
      if (panel.style.display !== 'none') panel.textContent = 'NAS 自动采集状态暂时无法读取。';
    });
}

function loadData() {
  loadRuntimeStatus();
  fetch('data/dashboard_data.json', {cache: 'no-store'})
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(productionView)
    .then(data => {
      renderCards(data);
      renderLegend(data);
      renderDataNotice(data);
      renderSignals(data);
      renderDailySummary(data);
      renderQualityOverview(data);
      renderRecentObservations(data);
      if (typeof Chart !== 'undefined') renderCharts(data);
      else document.getElementById('charts').textContent = '图表组件加载失败，指数和质量信息仍可查看。';
      renderTopPosts(data);
    })
    .catch(err => {
      activeCharts.forEach(chart => chart.destroy());
      activeCharts = [];
      ['legend', 'signals-panel', 'charts', 'top-posts', 'daily-summary', 'quality-overview', 'recent-observations'].forEach(id => {
        document.getElementById(id).replaceChildren();
      });
      const banner = document.getElementById('mock-banner');
      banner.style.display = 'block';
      banner.textContent = '当前数据源不可用；旧指数、信号、图表和典型帖已隐藏。恢复连接后页面会自动重试。';
      document.getElementById('update-time').textContent = '数据加载失败';
      document.getElementById('cards').innerHTML =
        `<div class="loading">⚠️ 数据加载失败: ${escapeHtml(err.message)}<br>请稍后重试，或检查 NAS 采集与网页服务的运行状态。</div>`;
    });
}
loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
